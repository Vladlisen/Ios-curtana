# HakiOS (iOS 16.5 on XNU) for the Redmi Note 9S, built from qdizax-w/hakios-xnu-kernel.
# The same steps as that repository's .github/workflows/miatoll.yml, pinned to one revision.
# No Apple files go in or come out: the iPhone identity and the iOS system image are made from
# your own IPSW (sysimage/unpack.sh, userland/build.sh) on the computer that prepares the phone.
name: hakios-miatoll

on:
  push:
    paths: ['.github/workflows/hakios-miatoll.yml']
  workflow_dispatch:
    inputs:
      hakios_ref:
        description: "qdizax-w/hakios-xnu-kernel revision"
        type: string
        default: "874971eedbc77ae8adadbcdab76371f49e3eea58"

env:
  HAKIOS_REF: ${{ inputs.hakios_ref || '874971eedbc77ae8adadbcdab76371f49e3eea58' }}

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hakios
    steps:
      - uses: actions/checkout@v5
        with:
          repository: qdizax-w/hakios-xnu-kernel
          ref: ${{ env.HAKIOS_REF }}
          path: hakios

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential git curl clang lld llvm python3 perl xz-utils flex bison m4 autoconf automake libtool uuid-dev libssl-dev libbsd-dev zlib1g-dev meson ninja-build pkg-config python3-venv

      - name: theos (cctools + iPhoneOS16.5.sdk)
        run: |
          T=$HOME/theos
          git clone -q --depth 1 https://github.com/theos/theos.git $T
          mkdir -p $T/toolchain
          curl -sfL https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz | tar -xJ -C $T/toolchain
          [ -x $T/toolchain/linux/iphone/bin/ld ] || { find $T/toolchain -maxdepth 4 | head -50; exit 1; }
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk $T/sdks/

      - name: Kernel
        run: |
          python3 tools/hakios-device.py sync
          python3 tools/hakios-config.py defconfig miatoll
          xnu/apply.sh
          xnu-deps/setup.sh || { for f in xnu-deps/*.log; do echo "=== $f"; grep -n -iE 'error|not found|No such' $f | head -30; tail -40 $f; done; exit 1; }
          tools/mk-ath10k.sh
          # XNU's build ends with a known export-check error after the kernel is linked: judge by the file.
          KERNEL_LOG=kernel-build.log tools/make-kernel.sh -j"$(nproc)" > /dev/null 2>&1 || true
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          [ -f $K ] || { grep -n 'error:' kernel-build.log | head -50; tail -80 kernel-build.log; exit 1; }
          mkdir -p out && cp $K out/hakios-kernel && cp .config out/miatoll.config

      - name: Userland programs and Mesa
        run: |
          # The image steps need the real iOS files and fail here; obj/ is what is wanted.
          mkdir -p sysimage/rootfs/usr/lib
          source devices/miatoll/boot.conf
          (cd userland && env FLASHBOOT=1 $USERLAND_VARS ./build.sh) > userland-build.log 2>&1 || true
          for f in init stage0 var_store libhakios.dylib libhakios.sb.dylib libhakios.gl.dylib libOSMesa.8.dylib; do
            [ -f userland/obj/$f ] || { echo "missing userland/obj/$f"; tail -80 userland-build.log; exit 1; }
          done
          mkdir -p out/userland && cp -r userland/obj/* out/userland/ && rm -f out/userland/*.o out/userland/*.h

      - uses: actions/upload-artifact@v5
        with:
          name: hakios-miatoll-kernel
          path: hakios/out/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kernel-logs
          path: |
            hakios/kernel-build.log
            hakios/userland-build.log
          if-no-files-found: ignore

  uefi:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hakios
    steps:
      - uses: actions/checkout@v5
        with:
          repository: qdizax-w/hakios-xnu-kernel
          ref: ${{ env.HAKIOS_REF }}
          path: hakios

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential git curl clang-18 lld-18 llvm-18 nasm uuid-dev iasl \
            python3 python3-venv python3-pip gcc-aarch64-linux-gnu mono-devel

      - name: Loader (placeholder identity)
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          xnuloader/mkidentity.sh --placeholder
          xnuloader/build.sh

      - name: Mu-Silicium 3.6 with the miatoll port
        run: |
          git config --global user.email ci@localhost && git config --global user.name ci
          python3 tools/hakios-device.py sync
          devices/miatoll/uefi/apply.sh
          python3 -m venv venv && venv/bin/pip install -q -r Mu-Silicium-3.6/pip-requirements.txt

      - name: UEFI (clang 18, Redmi Note 9S = model 0)
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          cd Mu-Silicium-3.6
          source ../venv/bin/activate
          CLANG_BIN=/usr/lib/llvm-18/bin/ python3 build_uefi.py -d miatoll -m 0 -r RELEASE

      - name: Boot image and checksums
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          source devices/miatoll/boot.conf
          mkdir -p out
          python3 xnuloader/mkpayload.py -o out/usb-payload.bin loader.efi=xnuloader/loader.efi --usb
          FD_BASE=$FD_BASE FD_SIZE=$FD_SIZE PAYLOAD_BASE=$PAYLOAD_BASE UEFI_TARGET=$UEFI_TARGET MU_SILICIUM=$MU_SILICIUM \
            python3 mkxnuimg.py -p out/usb-payload.bin -o out/miatoll-boot.img
          FV=Mu-Silicium-3.6/Build/miatollPkg/RELEASE_CLANGPDB/FV
          cp "$(ls $FV/*.fd | head -1)" out/MIATOLL_UEFI.fd
          cp xnuloader/loader.efi out/
          # Upstream records the UEFI build that boots; a different hash is a warning, not a failure.
          want=$(awk '/MIATOLL_UEFI.fd/{print $1}' devices/miatoll/prebuilt/SHA256SUMS)
          got=$(sha256sum out/MIATOLL_UEFI.fd | cut -d' ' -f1)
          echo "UEFI sha256 $got (known-good $want)"
          [ "$got" = "$want" ] || echo "::warning::MIATOLL_UEFI.fd differs from the build upstream booted"
          (cd out && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v5
        with:
          name: hakios-miatoll-boot
          path: hakios/out/
